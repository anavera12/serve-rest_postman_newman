name: API Tests - ServeRest

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: v20.17.0

      - name: Install dependencies
        run: npm install

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Newman Tests
        run: |
          npx newman run ServeRestAPITests.postman_collection.json \
            -e env.postman_environment.json \
            -r cli,htmlextra,junit \
            --reporter-htmlextra-export ./reports/newman-report.html \
            --reporter-junit-export ./reports/junit-report.xml

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-html-report
          path: reports/newman-report.html
          retention-days: 30

      - name: Upload JUnit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-junit-report
          path: reports/junit-report.xml
          retention-days: 30