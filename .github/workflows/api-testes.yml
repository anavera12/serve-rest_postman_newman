name: API Tests - ServeRest

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      test_folder:
        description: 'Pasta específica para executar (deixe vazio para executar todos)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'User Admin'
          - 'Auth'
          - 'Product'
          - 'Cart'
          - 'Flow (E2E)'
          - 'Data Cleanup'
  schedule:
    - cron: '0 6 * * *'

env:
  NODE_VERSION: '20'

jobs:
  api-tests:
    name: Executar Testes da API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Criar diretório de relatórios
        run: mkdir -p reports

      - name: Executar testes Newman
        id: newman-tests
        continue-on-error: true
        run: |
          if [ -n "${{ github.event.inputs.test_folder }}" ]; then
            echo "Executando testes da pasta: ${{ github.event.inputs.test_folder }}"
            npx newman run ServeRestAPITests.postman_collection.json \
              -e env.postman_environment.json \
              --folder "${{ github.event.inputs.test_folder }}" \
              -r cli,htmlextra,junit \
              --reporter-htmlextra-export ./reports/newman-report.html \
              --reporter-htmlextra-title "ServeRest API Tests - ${{ github.event.inputs.test_folder }}" \
              --reporter-htmlextra-browserTitle "ServeRest API Report" \
              --reporter-htmlextra-showEnvironmentData \
              --reporter-htmlextra-showGlobalData \
              --reporter-htmlextra-showFolderDescription \
              --reporter-htmlextra-displayProgressBar \
              --reporter-junit-export ./reports/junit-report.xml \
              --color on
          else
            echo "Executando todos os testes"
            npx newman run ServeRestAPITests.postman_collection.json \
              -e env.postman_environment.json \
              -r cli,htmlextra,junit \
              --reporter-htmlextra-export ./reports/newman-report.html \
              --reporter-htmlextra-title "ServeRest API Tests Report" \
              --reporter-htmlextra-browserTitle "ServeRest API Report" \
              --reporter-htmlextra-showEnvironmentData \
              --reporter-htmlextra-showGlobalData \
              --reporter-htmlextra-showFolderDescription \
              --reporter-htmlextra-displayProgressBar \
              --reporter-junit-export ./reports/junit-report.xml \
              --color on
          fi

      - name: Upload Relatório HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-html-report
          path: reports/newman-report.html
          retention-days: 30

      - name: Upload Relatório JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-junit-report
          path: reports/junit-report.xml
          retention-days: 30

      - name: Publicar Resultados dos Testes
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: 'Resultados dos Testes Newman'
          path: reports/junit-report.xml
          reporter: java-junit
          fail-on-error: false

      - name: Gerar Resumo
        if: always()
        run: |
          echo "## Resultados dos Testes da API ServeRest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Informação | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Data/Hora | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Autor | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloads" >> $GITHUB_STEP_SUMMARY
          echo "- **Relatório HTML**: Disponível na aba 'Artifacts'" >> $GITHUB_STEP_SUMMARY
          echo "- **Relatório JUnit**: Disponível na aba 'Artifacts'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Resultado" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.newman-tests.outcome }}" == "success" ]; then
            echo "**Todos os testes passaram!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Alguns testes falharam. Verifique os relatórios.**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verificar status dos testes
        if: steps.newman-tests.outcome == 'failure'
        run: |
          echo "::error::Alguns testes falharam! Verifique os relatórios para mais detalhes."
          exit 1

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar Smoke Tests (Auth)
        run: |
          npx newman run ServeRestAPITests.postman_collection.json \
            -e env.postman_environment.json \
            --folder "Auth" \
            -r cli \
            --color on

  deploy-reports:
    name: Deploy Relatórios
    runs-on: ubuntu-latest
    needs: api-tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download do Relatório HTML
        uses: actions/download-artifact@v4
        with:
          name: newman-html-report
          path: ./public

      - name: Criar index.html
        run: mv ./public/newman-report.html ./public/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4